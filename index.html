
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My People</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">
    <h1>My People</h1>
    <p class="subtitle">Ma'lumotlarni ro'yxatga qo'shish</p>

    <form id="myForm">
        <input type="text" id="ism" placeholder="Ism" required>
        <input type="text" id="familiya" placeholder="Familiya" required>
        <input type="number" id="yosh" placeholder="Yosh" min="1" required>
        <input type="text" id="shahar" placeholder="Shahar" required>
        
        <label class="upload">
            <span>📷 Rasm tanlash</span>
            <input type="file" id="rasm" accept="image/*" required>
        </label>

        <button type="submit">+ SEND</button>
    </form>

    <h2>Ro'yxat</h2>

    <div class="table-box">
        <table class="jadval">
            <thead>
                <tr>
                    <th>Nomer</th>
                    <th>Rasm</th>
                    <th>Ism</th>
                    <th>Familiya</th>
                    <th>Yosh</th>
                    <th>Shahar</th>
                    <th>Amal</th>
                </tr>
            </thead>
            <tbody id="royhat"></tbody>
        </table>
    </div>
</div>

</body>
</html>
